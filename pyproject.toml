[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "fesafe-signal-prep"
version = "0.1.0"
description = "Prepare synchronized vehicle acceleration histories for fe-safe"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = "MIT"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "openpyxl>=3.1.5,<4", "matplotlib>=3.9,<4"]

[project.scripts]
fesafe-signal = "fesafe_signal.cli:main"

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/fesafe_signal"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
